# Blueprint per il deploy gratuito su Render (https://render.com).
# Su Render: New > Blueprint, collega il repo GitHub: questo file viene letto in automatico.
services:
  - type: web
    name: nutritionist-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Python 3.11 evita il bug di typing di 3.9.0 e permette pydantic recenti.
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Provider LLM: 'groq' (gratis, open-source) o 'claude' (a pagamento).
      - key: NUTRI_LLM_PROVIDER
        value: "groq"
      # Secret: NON committato. Render lo chiede in dashboard al primo deploy.
      - key: GROQ_API_KEY
        sync: false
      # Opzionale: abilita il fallback automatico a Claude se Groq va in
      # errore/rate-limit. Lascia vuoto per disattivare il fallback.
      - key: ANTHROPIC_API_KEY
        sync: false
